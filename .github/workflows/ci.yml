name: Python checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: File and secret hygiene check
        shell: bash
        run: |
          test -f AGENTS.md
          test -f docs/ARCHITECTURE.md
          if git ls-files | grep -E '(^|/)(\.env|secrets\.toml)$|\.(sqlite|db)$'; then
            echo 'Sensitive local configuration/database committed' >&2
            exit 1
          fi
